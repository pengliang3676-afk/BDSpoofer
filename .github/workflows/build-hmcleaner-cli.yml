name: Build HMCleaner CLI

on:
  workflow_dispatch:
  push:
    paths:
      - "HMCleaner/hmcleaner-standalone.m"
      - "HMCleaner/README-standalone-cli.md"
      - "HMCleaner/package/control"
      - ".github/workflows/build-hmcleaner-cli.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Build arm64 and arm64e
        run: |
          set -euo pipefail
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          mkdir -p build-hmcleaner-cli
          for ARCH in arm64 arm64e; do
            xcrun --sdk iphoneos clang \
              -arch "$ARCH" \
              -isysroot "$SDK" \
              -miphoneos-version-min=15.0 \
              -fobjc-arc -fblocks -O2 \
              -Wall -Wextra \
              -Werror=return-type \
              -Werror=implicit-function-declaration \
              -framework Foundation \
              -lsqlite3 \
              HMCleaner/hmcleaner-standalone.m \
              -o "build-hmcleaner-cli/hmcleaner.$ARCH"
          done
          xcrun lipo -create build-hmcleaner-cli/hmcleaner.arm64 build-hmcleaner-cli/hmcleaner.arm64e -output build-hmcleaner-cli/hmcleaner
          xcrun lipo build-hmcleaner-cli/hmcleaner -verify_arch arm64 arm64e
          xcrun lipo -archs build-hmcleaner-cli/hmcleaner | tee lipo-archs.txt
          file build-hmcleaner-cli/hmcleaner
          otool -L build-hmcleaner-cli/hmcleaner

      - name: Sign and package RootHide deb
        run: |
          set -euo pipefail
          codesign --force --sign - --timestamp=none build-hmcleaner-cli/hmcleaner
          codesign --verify --strict build-hmcleaner-cli/hmcleaner

          PKG=pkgroot
          OUT=dist-hmcleaner-cli
          mkdir -p "$PKG/usr/local/bin" "$PKG/DEBIAN" "$OUT" deb-parts
          cp build-hmcleaner-cli/hmcleaner "$PKG/usr/local/bin/hmcleaner"
          chmod 0755 "$PKG/usr/local/bin/hmcleaner"
          cp HMCleaner/package/control "$PKG/DEBIAN/control"

          printf '2.0\n' > deb-parts/debian-binary
          COPYFILE_DISABLE=1 tar -C "$PKG/DEBIAN" -czf deb-parts/control.tar.gz .
          COPYFILE_DISABLE=1 tar -C "$PKG" --exclude='./DEBIAN' -czf deb-parts/data.tar.gz .
          (cd deb-parts && ar -rc "../$OUT/HMCleaner_1.1.4_iphoneos-arm64e.deb" debian-binary control.tar.gz data.tar.gz)
          cp build-hmcleaner-cli/hmcleaner lipo-archs.txt HMCleaner/README-standalone-cli.md "$OUT/"

      - name: Verify artifacts
        run: |
          set -euo pipefail
          OUT=dist-hmcleaner-cli
          ar -t "$OUT/HMCleaner_1.1.4_iphoneos-arm64e.deb" | tee "$OUT/deb-members.txt"
          rm -rf verify-deb
          mkdir verify-deb
          (cd verify-deb && ar -x "../$OUT/HMCleaner_1.1.4_iphoneos-arm64e.deb")
          tar -tzf verify-deb/data.tar.gz | tee "$OUT/payload.txt"
          test "$(tar -tzf verify-deb/data.tar.gz | grep -c '^./usr/local/bin/hmcleaner$')" -eq 1
          if tar -tzf verify-deb/data.tar.gz | grep -q '^./var/jb/'; then
            echo 'Unexpected /var/jb payload prefix' >&2
            exit 1
          fi
          shasum -a 256 HMCleaner/hmcleaner-standalone.m "$OUT/hmcleaner" "$OUT/HMCleaner_1.1.4_iphoneos-arm64e.deb" | tee "$OUT/SHA256SUMS.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: HMCleaner-CLI-1.1.4
          path: dist-hmcleaner-cli/
          if-no-files-found: error
