name: Build BDDiag3 (SMS-login device-field discovery probe)

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build universal dylib (arm64 + arm64e)
        run: |
          set -e
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          SRC=BDDiag3.m
          echo "SDK=$SDK"; echo "SRC=$SRC"; test -n "$SRC"
          test -f "$SRC"
          for ARCH in arm64 arm64e; do
            xcrun clang -arch $ARCH -isysroot "$SDK" -target $ARCH-apple-ios15.0 \
              -fobjc-arc -fno-inline \
              -dynamiclib \
              -install_name @rpath/BDDiag3.dylib \
              -framework Foundation -framework UIKit -framework CoreGraphics \
              -O2 -Wno-unused -Wno-unused-function \
              -o BDDiag3-$ARCH.dylib "$SRC"
          done
          xcrun lipo -create BDDiag3-arm64.dylib BDDiag3-arm64e.dylib -output BDDiag3.dylib
          xcrun lipo BDDiag3.dylib -verify_arch arm64 arm64e
          codesign --force --sign - --timestamp=none BDDiag3.dylib
          codesign --verify --strict --verbose=2 BDDiag3.dylib
          echo "---- arch ----"; xcrun lipo -info BDDiag3.dylib
          echo "---- id ----"; otool -D BDDiag3.dylib
          echo "---- deps ----"; otool -L BDDiag3.dylib | head -20
          echo "---- file ----"; file BDDiag3.dylib

      - name: Verify artifact exists
        run: |
          test -f BDDiag3.dylib
          ls -la BDDiag3.dylib

      - uses: actions/upload-artifact@v4
        with:
          name: BDDiag3-dylib
          path: BDDiag3.dylib
          if-no-files-found: error
