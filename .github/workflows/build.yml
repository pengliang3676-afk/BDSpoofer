name: Build BDDiag4 (focused SMS-login request probe)

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build universal dylib (arm64 + arm64e)
        run: |
          set -e
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          SRC=BDDiag4.m
          echo "SDK=$SDK"; echo "SRC=$SRC"; test -n "$SRC"
          test -f "$SRC"
          for ARCH in arm64 arm64e; do
            xcrun clang -arch $ARCH -isysroot "$SDK" -target $ARCH-apple-ios15.0 \
              -fobjc-arc -fno-inline \
              -dynamiclib \
              -install_name @rpath/BDDiag4.dylib \
              -framework Foundation -framework UIKit -framework CoreGraphics \
              -O2 -Wno-unused -Wno-unused-function \
              -o BDDiag4-$ARCH.dylib "$SRC"
          done
          xcrun lipo -create BDDiag4-arm64.dylib BDDiag4-arm64e.dylib -output BDDiag4.dylib
          xcrun lipo BDDiag4.dylib -verify_arch arm64 arm64e
          codesign --force --sign - --timestamp=none BDDiag4.dylib
          codesign --verify --strict --verbose=2 BDDiag4.dylib
          echo "---- arch ----"; xcrun lipo -info BDDiag4.dylib
          echo "---- id ----"; otool -D BDDiag4.dylib
          echo "---- deps ----"; otool -L BDDiag4.dylib | head -20
          echo "---- file ----"; file BDDiag4.dylib

      - name: Verify artifact exists
        run: |
          test -f BDDiag4.dylib
          ls -la BDDiag4.dylib

      - uses: actions/upload-artifact@v4
        with:
          name: BDDiag4-dylib
          path: BDDiag4.dylib
          if-no-files-found: error
