name: Build BDDiag (read-only diagnostic dylib)

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build universal dylib (arm64 + arm64e)
        run: |
          set -e
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          SRC=$(find . -name 'BDDiag.m' -not -path '*/.*' | head -1)
          echo "SDK=$SDK"; echo "SRC=$SRC"; test -n "$SRC"
          for ARCH in arm64 arm64e; do
            xcrun clang -arch $ARCH -isysroot "$SDK" -target $ARCH-apple-ios15.0 \
              -fobjc-arc -fno-inline \
              -dynamiclib \
              -framework Foundation -framework UIKit -framework CoreGraphics \
              -O2 -Wno-unused -Wno-unused-function \
              -o BDDiag-$ARCH.dylib "$SRC"
          done
          xcrun lipo -create BDDiag-arm64.dylib BDDiag-arm64e.dylib -output BDDiag.dylib
          codesign --force --sign - --timestamp=none BDDiag.dylib
          echo "---- arch ----"; xcrun lipo -info BDDiag.dylib
          echo "---- deps ----"; otool -L BDDiag.dylib | head -20
          echo "---- file ----"; file BDDiag.dylib

      - name: Verify artifact exists
        run: |
          test -f BDDiag.dylib
          ls -la BDDiag.dylib

      - uses: actions/upload-artifact@v4
        with:
          name: BDDiag-dylib
          path: BDDiag.dylib
          if-no-files-found: error
