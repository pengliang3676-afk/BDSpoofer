name: Build MGspoofer1.0.0

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode and SDK info
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos --show-sdk-version

      - name: Build arm64
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun --sdk iphoneos clang \
            -arch arm64 \
            -isysroot "$SDK_PATH" \
            -miphoneos-version-min=15.0 \
            -fobjc-arc \
            -dynamiclib \
            -framework Foundation \
            -framework UIKit \
            -framework CoreGraphics \
            -framework AdSupport \
            -framework CoreTelephony \
            -framework Security \
            -framework WebKit \
            -framework SystemConfiguration \
            -framework CoreLocation \
            -framework Contacts \
            -framework EventKit \
            -install_name @rpath/MGspoofer1.0.0.dylib \
            -o MGspoofer1.0.0_arm64.dylib \
            BDSpoofer.m

      - name: Build arm64e
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun --sdk iphoneos clang \
            -arch arm64e \
            -isysroot "$SDK_PATH" \
            -miphoneos-version-min=15.0 \
            -fobjc-arc \
            -dynamiclib \
            -framework Foundation \
            -framework UIKit \
            -framework CoreGraphics \
            -framework AdSupport \
            -framework CoreTelephony \
            -framework Security \
            -framework WebKit \
            -framework SystemConfiguration \
            -framework CoreLocation \
            -framework Contacts \
            -framework EventKit \
            -install_name @rpath/MGspoofer1.0.0.dylib \
            -o MGspoofer1.0.0_arm64e.dylib \
            BDSpoofer.m

      - name: Create fat binary and verify
        run: |
          lipo -create MGspoofer1.0.0_arm64.dylib MGspoofer1.0.0_arm64e.dylib -output MGspoofer1.0.0.dylib
          echo "=== file type ==="
          file MGspoofer1.0.0.dylib
          echo "=== dependencies ==="
          otool -L MGspoofer1.0.0.dylib
          echo "=== platform ==="
          otool -l MGspoofer1.0.0.dylib | grep -A5 LC_BUILD_VERSION

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MGspoofer1.0.0
          path: |
            MGspoofer1.0.0.dylib
            bdspoofer_config.plist
