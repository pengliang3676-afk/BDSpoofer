name: Build BDSpoofer UI1 and Crane Manager
on:
  push:
    branches: ["**"]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build and verify release with Xcode
        run: bash scripts/build_release_xcode.sh
      - uses: actions/upload-artifact@v4
        with:
          name: BDSpoofer-1.8.1-UI1-CraneManager-1.0.2-ui1
          path: |
            dist-ui1/BDSpoofer_1.8.1_UI1.dylib
            dist-ui1/BDSpooferCraneManager_1.0.2-ui1_RootHide.deb
            dist-ui1/RELEASE_UI1.md
            dist-ui1/bdspoofer_config.plist
            dist-ui1/SHA256SUMS.txt
