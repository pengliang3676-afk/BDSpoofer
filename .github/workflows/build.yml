name: Build BDSpoofer

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode and SDK info
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos --show-sdk-version

      - name: Build arm64
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun --sdk iphoneos clang \
            -arch arm64 \
            -isysroot "$SDK_PATH" \
            -miphoneos-version-min=15.0 \
            -fobjc-arc \
            -dynamiclib \
            -framework Foundation \
            -framework UIKit \
            -framework CoreGraphics \
            -framework AdSupport \
            -framework CoreTelephony \
            -framework WebKit \
            -install_name @rpath/BDSpoofer.dylib \
            -o BDSpoofer_arm64.dylib \
            BDSpoofer.m

      - name: Build arm64e
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun --sdk iphoneos clang \
            -arch arm64e \
            -isysroot "$SDK_PATH" \
            -miphoneos-version-min=15.0 \
            -fobjc-arc \
            -dynamiclib \
            -framework Foundation \
            -framework UIKit \
            -framework CoreGraphics \
            -framework AdSupport \
            -framework CoreTelephony \
            -framework WebKit \
            -install_name @rpath/BDSpoofer.dylib \
            -o BDSpoofer_arm64e.dylib \
            BDSpoofer.m

      - name: Create fat binary and verify
        run: |
          lipo -create BDSpoofer_arm64.dylib BDSpoofer_arm64e.dylib -output BDSpoofer.dylib
          echo "=== file type ==="
          file BDSpoofer.dylib
          echo "=== dependencies ==="
          otool -L BDSpoofer.dylib
          echo "=== platform ==="
          otool -l BDSpoofer.dylib | grep -A5 LC_BUILD_VERSION

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BDSpoofer
          path: |
            BDSpoofer.dylib
            bdspoofer_config.plist
