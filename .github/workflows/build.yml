name: Build BDDiag2 (targeted read-only probe dylib)

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build universal dylib (arm64 + arm64e)
        run: |
          set -e
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          SRC=$(find . -name 'BDDiag2.m' -not -path '*/.*' | head -1)
          echo "SDK=$SDK"; echo "SRC=$SRC"; test -n "$SRC"
          for ARCH in arm64 arm64e; do
            xcrun clang -arch $ARCH -isysroot "$SDK" -target $ARCH-apple-ios15.0 \
              -fobjc-arc -fno-inline \
              -dynamiclib \
              -framework Foundation -framework UIKit -framework CoreGraphics \
              -O2 -Wno-unused -Wno-unused-function \
              -o BDDiag2-$ARCH.dylib "$SRC"
          done
          xcrun lipo -create BDDiag2-arm64.dylib BDDiag2-arm64e.dylib -output BDDiag2.dylib
          codesign --force --sign - --timestamp=none BDDiag2.dylib
          echo "---- arch ----"; xcrun lipo -info BDDiag2.dylib
          echo "---- deps ----"; otool -L BDDiag2.dylib | head -20
          echo "---- file ----"; file BDDiag2.dylib

      - name: Verify artifact exists
        run: |
          test -f BDDiag2.dylib
          ls -la BDDiag2.dylib

      - uses: actions/upload-artifact@v4
        with:
          name: BDDiag2-dylib
          path: BDDiag2.dylib
          if-no-files-found: error
