name: Build 卐解 UI1 and 卍解
on:
  push:
    branches: ["**"]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build and verify release with Xcode
        run: bash scripts/build_release_xcode.sh
      - uses: actions/upload-artifact@v4
        with:
          name: BDSpoofer-1.8.2-UI1.2-CraneManager-1.0.3-ui1
          path: |
            dist-ui1/BDSpoofer_1.8.2_UI1.2.dylib
            dist-ui1/BDSpooferCraneManager_1.0.3-ui1_RootHide.deb
            dist-ui1/RELEASE_UI1.md
            dist-ui1/bdspoofer_config.plist
            dist-ui1/SHA256SUMS.txt
