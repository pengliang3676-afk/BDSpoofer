name: Build HMCleaner
on:
  push:
    branches: ["**"]
    paths:
      - "HMCleaner/**"
      - ".github/workflows/build-hmcleaner.yml"
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Test, build and verify
        run: bash HMCleaner/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: HMCleaner-1.2.1-RootHide
          path: dist-hmcleaner/
          if-no-files-found: error
