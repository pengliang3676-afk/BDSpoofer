name: Build Full Probe

on:
  push:
    branches: ["diag/full-probe"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build full probe dylib
        run: |
          set -euo pipefail
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          mkdir -p out
          for ARCH in arm64 arm64e; do
            xcrun --sdk iphoneos clang -arch "$ARCH" -isysroot "$SDK" \
              -miphoneos-version-min=15.0 -fobjc-arc -fblocks \
              -Werror=return-type -Werror=implicit-function-declaration \
              -dynamiclib -install_name @rpath/BDSFullProbe.dylib \
              -framework Foundation -framework UIKit -framework CoreGraphics \
              -framework AdSupport -framework AppTrackingTransparency \
              -framework SystemConfiguration \
              BDSFullProbe.m -o "out/BDSFullProbe_$ARCH.dylib"
          done
          lipo -create out/BDSFullProbe_arm64.dylib out/BDSFullProbe_arm64e.dylib \
            -output out/BDSFullProbe.dylib
          codesign --force --sign - --timestamp=none out/BDSFullProbe.dylib
          lipo -info out/BDSFullProbe.dylib
          codesign --verify --strict out/BDSFullProbe.dylib
          shasum -a 256 out/BDSFullProbe.dylib | tee out/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: BDSFullProbe-1.0
          path: |
            out/BDSFullProbe.dylib
            out/SHA256.txt
