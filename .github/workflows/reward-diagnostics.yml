name: Build passive reward diagnostics
on:
  push:
    paths:
      - 'RewardDiagnostics/**'
      - '.github/workflows/reward-diagnostics.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test and compile independent diagnostic dylib
        run: bash RewardDiagnostics/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: BDSRewardDiagnostics-0.5.0
          path: dist-ui1/reward-diagnostics/
